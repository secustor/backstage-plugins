name: Renovate

on:
  schedule:
    - cron: '17 * * * *' # Every hour at :17 (off-minute to reduce API congestion)
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false # Queue runs, don't cancel in-flight ones

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          configurationFile: .github/renovate-global.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_PLATFORM_COMMIT: 'true' # Sign commits via the GitHub App
          LOG_LEVEL: 'debug'
